<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vacancy Form</title>
    <script src="validation.js"></script>
</head>
<body>
    <h1>Vacancy Application Form</h1>
    <form name="vacancyApplicationForm"
          onsubmit="return ValidateVacancyForm()" novalidate>
        <label for="name">First Name:</label>
        <input id="name" name="name" type="text">
        <span id="nameError"></span>

        <label for="surname">Last Name:</label>
        <input id="surname" name="surname" type="text">
        <span id="surnameError"></span>

        <p>Are you a UK resident?</p>
        <input type="radio" id="uk-resident" name="uk-resident" value="yes">
        <label for="uk-resident">Yes</label>
        <input type="radio" id="not-uk-resident" name="uk-resident" value="no">
        <label for="not-uk-resident">No</label>
        <span id="ukResidentError"></span>

        <label for="telNo">Telephone:</label>
        <input type="tel" id="telNo" name="telNo">
        <span id="telNoError"></span>

        <button type="submit">Apply Now</button>
    </form>
</body>
</html>
